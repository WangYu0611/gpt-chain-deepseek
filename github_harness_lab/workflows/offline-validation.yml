# INERT HERE. Manual template only; does not request DeepSeek or publish reports.
name: Harness Lab offline validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Unit and offline integration tests
        shell: pwsh
        working-directory: github_harness_lab
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m lab_harness demo --output .runtime/demo --scenario all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output 'Local fixtures only; no real GitHub / DeepSeek / ChatGPT loop was tested.'
