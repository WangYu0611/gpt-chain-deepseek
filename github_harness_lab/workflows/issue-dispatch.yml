# INERT HERE. Copy to the target repository .github/workflows only after review.
# This template dispatches a PLAN, never a model request or publication.
name: Harness Lab issue plan
on:
  issues:
    types: [labeled]
permissions:
  contents: read
concurrency:
  group: harness-issue-${{ github.repository_id }}-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  plan:
    if: >-
      vars.HARNESS_LAB_ENABLED == 'true' &&
      (github.event.label.name == 'agent:ready' || github.event.label.name == 'agent:rework')
    runs-on: [self-hosted, Windows, X64, dsh-lab]
    timeout-minutes: 10
    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2; review/update before deployment
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Validate and show plan
        shell: pwsh
        env:
          LAB_ROOT: ${{ github.workspace }}/github_harness_lab
          LAB_CONFIG: ${{ vars.HARNESS_LAB_CONFIG }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:LAB_CONFIG) { throw 'Set HARNESS_LAB_CONFIG to a trusted operator-owned config file' }
          Set-Location -LiteralPath $env:LAB_ROOT
          python -m lab_harness plan --config $env:LAB_CONFIG --event $env:GITHUB_EVENT_PATH
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Live integration remains blocked
        shell: pwsh
        run: Write-Output 'PLAN ONLY. Authenticated controller, remote journal and isolated publisher are not commissioned.'
