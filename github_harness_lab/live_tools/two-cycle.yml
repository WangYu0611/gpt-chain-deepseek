  wait-1:
    needs: [generate-1, publish-1]
    if: ${{ needs.publish-1.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      contents: read
      issues: read
      pull-requests: read
      statuses: read
    outputs:
      needs_rework: ${{ steps.review.outputs.needs_rework }}
      status: ${{ steps.review.outputs.status }}
    env:
      CYCLE_REVISION: '1'
