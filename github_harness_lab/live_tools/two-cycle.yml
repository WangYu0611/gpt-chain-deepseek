name: ChatGPT web two-rework drill
on:
  issues:
    types: [labeled]
permissions: {}
concurrency:
  group: dsh-cycle-002-${{ github.event.issue.number }}
  cancel-in-progress: false
env:
  CYCLE_ISSUE: '5'
  CYCLE_LOOP_ID: DSH-REWORK-002
  CYCLE_BASE_SHA: ${{ github.sha }}
  CYCLE_WORKFLOW_SHA: ${{ github.workflow_sha }}
  CYCLE_ISSUE_BODY_SHA256: 69e03dd5862d9997f1bad437301277980c22c55b8dcd20ad94ebeb0ac9ad0034
  CYCLE_AUTOMATION_ID: 6ae1a01927648191a716fc3f82e35179
jobs:
  generate-0:
    if: >-
      github.repository == 'WangYu0611/chatgpt-deepseek-harness-test-20261028' &&
      github.event.issue.number == 5 &&
      github.event.label.name == 'agent:cycle-ready' &&
      github.event.sender.login == 'WangYu0611' &&
      github.event.issue.user.login == 'WangYu0611' &&
      github.event.issue.state == 'open'
    runs-on: [dsh-cycle-20261028]
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      artifact-id: ${{ steps.evidence.outputs.artifact-id }}
    steps:
      - name: Generate one bounded repair on the local Runner
        id: controller
        shell: python {0}
        env:
          GH_CYCLE_READ_TOKEN: ${{ github.token }}
          CYCLE_REVISION: '0'
        run: |
          import os, sys
          from pathlib import Path
          home = Path(os.environ['HARNESS_SMOKE_HOME'])
          python = Path(os.environ['HARNESS_SMOKE_PYTHON'])
          if not home.is_absolute() or not home.is_dir() or Path(sys.executable).resolve() != python.resolve():
              raise SystemExit('Trusted controller/runtime is not configured')
          os.chdir(home)
          sys.path.insert(0, str(home))
          from lab_harness.live_cycle import main
          revision = int(os.environ['CYCLE_REVISION'])
          if main(['--event', os.environ['GITHUB_EVENT_PATH'], '--revision', str(revision)]) != 0:
              raise SystemExit('Bounded generation stopped; no automatic model retry')
          result = home / '.runtime' / 'cycle-output' / 'DSH-REWORK-002' / str(revision) / 'result.json'
          if not result.is_file() or any(c in str(result) for c in '\r\n'):
              raise SystemExit('Missing bounded artifact')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write('artifact_path=' + str(result) + '\n')
      - name: Upload sanitized candidate and actual test results
        id: evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cycle-5-0-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.controller.outputs.artifact_path }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  publish-0:
    needs: [generate-0]
    if: ${{ needs.generate-0.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
      statuses: write
    outputs:
      head_sha: ${{ steps.publish.outputs.head_sha }}
      pr: ${{ steps.publish.outputs.pr }}
      parent_sha: ${{ steps.publish.outputs.parent_sha }}
      publication: ${{ steps.publish.outputs.publication }}
    env:
      CYCLE_REVISION: '0'
      CYCLE_PARENT_SHA: ${{ github.sha }}
      CYCLE_ARTIFACT_ID: ${{ needs.generate-0.outputs.artifact-id }}
      GH_CYCLE_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout the trusted workflow commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Download only this stage's artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.generate-0.outputs.artifact-id }}
          path: cycle-artifact
          merge-multiple: true
      - name: Independently test the exact head and publish candidate
        id: publish
        run: python3 live_tools/publish_cycle.py publish --artifact cycle-artifact/result.json --output publisher-result.json
  wait-0:
    needs: [generate-0, publish-0]
    if: ${{ needs.publish-0.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      contents: read
      issues: read
      pull-requests: read
      statuses: read
    outputs:
      parent_sha: ${{ steps.publish.outputs.parent_sha }}
      publication: ${{ steps.publish.outputs.publication }}
    env:
      CYCLE_REVISION: '0'
      CYCLE_PARENT_SHA: ${{ needs.publish-0.outputs.parent_sha }}
      CYCLE_ARTIFACT_ID: ${{ needs.generate-0.outputs.artifact-id }}
      GH_CYCLE_TOKEN: ${{ github.token }}
      PUBLICATION_JSON: ${{ needs.publish-0.outputs.publication }}
    steps:
      - name: Checkout the trusted workflow commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Download the exact candidate artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.generate-0.outputs.artifact-id }}
          path: cycle-artifact
          merge-multiple: true
      - name: Restore publisher receipt from a structured output
        shell: python {0}
        run: |
          import os, json
          from pathlib import Path
          receipt = json.loads(os.environ['PUBLICATION_JSON'])
          Path('publisher-result.json').write_text(json.dumps(receipt), encoding='utf-8')
      - name: Wait for actual ChatGPT web review after completed CI
        id: review
        run: python3 live_tools/publish_cycle.py wait-review --artifact cycle-artifact/result.json --publication publisher-result.json --output review-result.json --timeout 1200
  generate-1:
    needs: [publish-0, wait-0]
    if: >-
      needs.wait-0.outputs.needs_rework == 'true'
    runs-on: [dsh-cycle-20261028]
