name: GitHub Issue linkage probe
on:
  issues:
    types: [labeled]
permissions:
  contents: read
jobs:
  receipt:
    if: >-
      github.repository == 'WangYu0611/chatgpt-deepseek-harness-test-20261028' &&
      github.event.label.name == 'integration:probe' &&
      github.event.sender.login == 'WangYu0611'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Post explicit GitHub-only receipt
        env:
          GH_PROBE_TOKEN: ${{ github.token }}
        run: python3 scripts/issue_probe.py
